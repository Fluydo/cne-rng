<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bannerBg" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#141328"/>
      <stop offset="50%" stop-color="#0a0a12"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c518" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f5c518" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="20%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="pinkGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f5c518"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="fifaLegend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bannerBg)"/>
  <circle cx="600" cy="280" r="420" fill="url(#goldGlow)"/>
  <circle cx="180" cy="480" r="350" fill="url(#purpleGlow)"/>
  <circle cx="1020" cy="420" r="320" fill="url(#pinkGlow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" fill="none" stroke="rgba(245, 197, 24, 0.25)" stroke-width="2"/>
  <rect x="32" y="32" width="1136" height="566" rx="18" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>

  <!-- Top Badge -->
  <g transform="translate(600, 110)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="rgba(245, 197, 24, 0.12)" stroke="#f5c518" stroke-width="1.5"/>
    <text x="0" y="5" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="3">
      ★ SCHOOL SUMMONING RNG ★
    </text>
  </g>

  <!-- Big Central Title -->
  <g transform="translate(600, 240)">
    <text x="0" y="0" font-family="'Syne', sans-serif" font-size="96" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" filter="url(#neon)" letter-spacing="6">
      CNE RNG
    </text>
    <text x="0" y="58" font-family="'Outfit', sans-serif" font-size="24" font-weight="600" fill="#f3f4f8" text-anchor="middle" letter-spacing="2">
      Collect Teachers, Students &amp; School Legends
    </text>
  </g>

  <!-- Feature Chips / Badges Row -->
  <g transform="translate(600, 390)">
    <!-- Chip 1: 33 Characters -->
    <g transform="translate(-360, 0)">
      <rect x="-85" y="-20" width="170" height="40" rx="12" fill="rgba(99, 102, 241, 0.18)" stroke="#818cf8" stroke-width="1.2"/>
      <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#c7d2fe" text-anchor="middle">33 CHARACTERS</text>
    </g>
    <!-- Chip 2: 9 Rarity Tiers -->
    <g transform="translate(-120, 0)">
      <rect x="-85" y="-20" width="170" height="40" rx="12" fill="rgba(236, 72, 153, 0.18)" stroke="#f472b6" stroke-width="1.2"/>
      <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#fbcfe8" text-anchor="middle">9 RARITY TIERS</text>
    </g>
    <!-- Chip 3: FIFA Legend Tiers -->
    <g transform="translate(120, 0)">
      <rect x="-85" y="-20" width="170" height="40" rx="12" fill="rgba(245, 197, 24, 0.18)" stroke="#f5c518" stroke-width="1.2"/>
      <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#fef08a" text-anchor="middle">LEGEND CARDS</text>
    </g>
    <!-- Chip 4: Cloud Saves -->
    <g transform="translate(360, 0)">
      <rect x="-85" y="-20" width="170" height="40" rx="12" fill="rgba(16, 185, 129, 0.18)" stroke="#34d399" stroke-width="1.2"/>
      <text x="0" y="6" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" fill="#a7f3d0" text-anchor="middle">CLOUD SYNC</text>
    </g>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(600, 510)">
    <text x="0" y="0" font-family="'Outfit', sans-serif" font-size="16" font-weight="500" fill="#757c91" text-anchor="middle">
      12-Hour Cycle Quests • Global Leaderboard • Multi-Pulls • Sound Effects • Free to Play
    </text>
    <text x="0" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#f5c518" text-anchor="middle">
      cne-rng.vercel.app
    </text>
  </g>
</svg>