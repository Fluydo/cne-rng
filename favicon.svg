<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#07070b"/>
    </radialGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f5c518"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#f5c518" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="64" height="64" rx="16" fill="url(#favBg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldBorder)" stroke-width="2"/>

  <!-- Glowing Polyhedron / Die -->
  <polygon points="32,10 50,21 50,43 32,54 14,43 14,21" fill="#18182b" stroke="url(#goldBorder)" stroke-width="2.5" filter="url(#shadow)"/>
  <line x1="32" y1="10" x2="32" y2="33" stroke="url(#goldBorder)" stroke-width="1.8" stroke-dasharray="1 1"/>
  <line x1="14" y1="21" x2="32" y2="33" stroke="url(#goldBorder)" stroke-width="1.8"/>
  <line x1="50" y1="21" x2="32" y2="33" stroke="url(#goldBorder)" stroke-width="1.8"/>
  <line x1="32" y1="33" x2="32" y2="54" stroke="url(#goldBorder)" stroke-width="2"/>

  <!-- Centered Sparkle Star -->
  <polygon points="32,22 34,29 41,31 34,33 32,40 30,33 23,31 30,29" fill="#fef08a"/>
  <circle cx="32" cy="31" r="2" fill="#fff"/>
</svg>